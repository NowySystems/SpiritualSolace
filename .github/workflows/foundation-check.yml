name: Foundation Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-check:
    name: Validate repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Scan for hard conflict markers and Codex artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning for hard merge conflict markers and Codex artifact fragments..."

          files_to_scan="$(find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -path './.next' -prune -o \
            -path './playwright-report' -prune -o \
            -path './test-results' -prune -o \
            -path './.github/workflows/foundation-check.yml' -prune -o \
            -path './agents/scripts/foundation-check.mjs' -prune -o \
            -path './AGENTS.md' -prune -o \
            -path './FOUNDATION_WORKFLOW.md' -prune -o \
            -path './SECURITY_RULES.md' -prune -o \
            -path './SAVE_STATE.md' -prune -o \
            -path './ROADMAP.md' -prune -o \
            -name 'package-lock.json' -prune -o \
            -type f -print)"

          if printf '%s\n' "$files_to_scan" | xargs -r grep -nE '<<<<<<<|>>>>>>>'; then
            echo "Found hard merge conflict markers."
            exit 1
          fi

          if printf '%s\n' "$files_to_scan" | xargs -r grep -nE 'codex/update|codex_patch|<<<<<<< codex|>>>>>>> codex'; then
            echo "Found Codex artifact fragments."
            exit 1
          fi

          if printf '%s\n' "$files_to_scan" | xargs -r grep -nE '^=======$'; then
            echo "Standalone ======= separators found. Soft-review only; not failing this workflow."
          fi

          echo "Artifact scan passed."

      - name: Basic secret pattern scan
        shell: bash
        run: |
          set -euo pipefail

          echo "Running basic secret pattern scan..."

          secret_files_to_scan="$(find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -path './.next' -prune -o \
            -path './playwright-report' -prune -o \
            -path './test-results' -prune -o \
            -path './.github/workflows/foundation-check.yml' -prune -o \
            -name 'package-lock.json' -prune -o \
            -name '*.md' -prune -o \
            -type f -print)"

          if printf '%s\n' "$secret_files_to_scan" | xargs -r grep -nE '(AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,}|firebase_admin|PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN PRIVATE KEY)'; then
            echo "Possible secret found. Review before continuing."
            exit 1
          fi

          echo "Secret pattern scan passed."

      - name: Run foundation check
        run: npm run foundation:check

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Run Playwright smoke tests
        run: npm run test:smoke
