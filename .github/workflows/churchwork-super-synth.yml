name: ChurchWork Super Synth Demo

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: churchwork-synth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  super-synth:
    name: Super synth / ChurchWork guided demo
    runs-on: [self-hosted, Windows, X64, workstation, heavy, private-only]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://synthetic.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key-for-ui-tests-only
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: synthetic-site-key-for-ui-tests-only
      NEXT_PUBLIC_CHURCHWORK_SYNTH_ADMIN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: cmd
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        shell: cmd
        run: npx playwright install chromium

      - name: Verify production build
        shell: cmd
        run: npm run build

      - name: Run ChurchWork super synth 25 times
        shell: cmd
        run: for /L %%i in (1,1,25) do (echo === E2E RUN %%i OF 25 === & call npm run synthetic:churchwork || exit /b 1)

      - name: Upload ChurchWork super synth report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: churchwork-super-synth-report
          path: |
            churchwork-playwright-report
            test-results/churchwork-synthetic
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    name: Deploy ChurchWork production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: super-synth
    runs-on: [self-hosted, Linux, X64, server, ci-standard, private-only]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy current main to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uLRvRNeEc9Gpr0vFapNGT8Su
          VERCEL_PROJECT_ID: prj_EIYzl1Txsl7ffNi5hpLaWvZJlnEO
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
