name: ChurchWork Super Synth Demo

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: churchwork-synth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  super-synth:
    name: Super synth / ChurchWork guided demo
    runs-on: [self-hosted, Linux, X64, server, ci-standard, private-only]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://synthetic.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key-for-ui-tests-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ChurchWork super synth
        run: npm run synthetic:churchwork

      - name: Upload ChurchWork super synth report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: churchwork-super-synth-report
          path: |
            churchwork-playwright-report
            test-results/churchwork-synthetic
          if-no-files-found: ignore
          retention-days: 1
